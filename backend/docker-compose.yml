
services:
  postgres:
    image: postgres:16
    container_name: shipment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shipment_user
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: shipment_db
    ports:
      - "5432:5432"
    volumes:
      - shipment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipment_user -d shipment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shipment_postgres_data:
